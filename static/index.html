<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App - Secure & Private</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Authentication Section -->
        <div id="authSection" class="auth-section">
            <div class="auth-card">
                <h1>📝 Welcome to Notes App</h1>
                <p>Sign in with Google to access your private notes</p>
                <button id="googleSignInBtn" class="google-signin-btn">
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Sign in with Google
                </button>
                <p class="auth-note">Your notes are private and secure</p>
            </div>
        </div>

        <!-- Main App Section (hidden until logged in) -->
        <div id="appSection" class="app-section" style="display: none;">
            <header>
                <div class="header-content">
                    <h1>📝 My Notes</h1>
                    <div class="user-info">
                        <img id="userPhoto" class="user-photo" alt="User">
                        <div class="user-details">
                            <span id="userName" class="user-name"></span>
                            <span id="userEmail" class="user-email"></span>
                        </div>
                        <button id="signOutBtn" class="sign-out-btn">Sign Out</button>
                    </div>
                </div>
            </header>

            <div class="create-note-section">
                <h2>Create New Note</h2>
                <form id="noteForm">
                    <input 
                        type="text" 
                        id="noteTitle" 
                        placeholder="Note Title" 
                        required
                        maxlength="200"
                    >
                    <textarea 
                        id="noteContent" 
                        placeholder="Note Content" 
                        required
                        rows="4"
                    ></textarea>
                    <button type="submit">Create Note</button>
                </form>
            </div>

            <div class="notes-section">
                <h2>Your Notes</h2>
                <div id="notesContainer" class="notes-grid">
                    <p class="loading">Loading your notes...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module" src="/static/script.js"></script>
</body>
</html>
